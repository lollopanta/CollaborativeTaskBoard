version: 1.0
runtime: nodejs24
build:
  commands:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install
    - node ace build --ignore-ts-errors
run:
  command: node build/bin/server.js
  network:
    port: 3333
  env:
    - name: NODE_ENV
      value: production
    - name: HOST
      value: 0.0.0.0
    - name: PORT
      value: 3333
healthCheck:
  path: /health
  interval: 10
  timeout: 5
  healthyThreshold: 1
  unhealthyThreshold: 3
